name: AI trader

on:
  schedule:
    # Every hour at :35, Mon-Fri, 13:35-20:35 UTC (covers US market hours all year).
    # The agent itself checks if the market is open and exits if not.
    - cron: "35 13-20 * * 1-5"
  workflow_dispatch: {}   # lets you press "Run workflow" by hand from your phone

concurrency: trader       # never two runs at once

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one trading cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
          PAPER: "true"
        run: python agent.py --once
