name: AI trader (OFF - replaced by scalper)

on:
  # OFF: the scalper replaced this bot. To turn it back on, restore the schedule:
  # schedule:
  #   - cron: "5,35 13-20 * * 1-5"
  workflow_dispatch: {}   # lets you press "Run workflow" by hand from your phone

concurrency: trader       # never two runs at once

permissions:
  contents: write   # lets the bot save its memory back to the repo

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one trading cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
          PAPER: "true"
          # HIGH-RISK EXPERIMENT (paper only): margin up to 4x + leveraged / volatile names.
          # To go back to the safe bot, set RISK_MODE to "normal" and restore the old settings
          # (see git history, commit "Enforce stop-losses...").
          RISK_MODE: aggressive
          WATCHLIST: "TQQQ,SQQQ,SOXL,SOXS,UPRO,SPXU,UGL,NUGT,JNUG,TSLA,NVDA,MSTR,COIN,SMCI,PLTR,SPY,QQQ,GLD"
          TRADING_STYLE: active
          FOCUS: "High-risk experiment. Leveraged ETFs: TQQQ/SQQQ (3x Nasdaq up/down), SOXL/SOXS (3x chips up/down), UPRO/SPXU (3x S&P up/down), UGL (2x gold), NUGT/JNUG (2x gold miners). Volatile stocks: TSLA, NVDA, MSTR, COIN, SMCI, PLTR. SPY/QQQ/GLD are leftovers from the safe bot - keep, rotate or sell them as you see fit. Go big on your best ideas."
          MIN_CONFIDENCE: "0.55"
          MAX_TRADES_PER_DAY: "20"
          MAX_POSITION_PCT: "1.0"
          MAX_ORDER_USD: "100000"
          MAX_POSITIONS: "6"
          DAILY_LOSS_LIMIT_PCT: "0.20"
          MIN_CASH_RESERVE_PCT: "0"
          MAX_GROSS_LEVERAGE: "4.0"
          OVERNIGHT_LEVERAGE: "1.9"
          DEFAULT_STOP_PCT: "0.08"
          MAX_STOP_PCT: "0.15"
        run: python agent.py --once
      - name: Save the trader's memory (diary + lessons)
        if: always()
        run: |
          git config user.name "ai-trader-bot"
          git config user.email "ai-trader-bot@users.noreply.github.com"
          git add memory/ 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "memory: ${{ github.workflow }}"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i*5)); done
          exit 1
