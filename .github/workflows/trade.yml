name: AI trader (gold stocks)

on:
  schedule:
    # Every 30 minutes, Mon-Fri, 13:05-20:35 UTC (covers US market hours all year).
    # The agent itself checks if the market is open and exits if not.
    - cron: "5,35 13-20 * * 1-5"
  workflow_dispatch: {}   # lets you press "Run workflow" by hand from your phone

concurrency: trader       # never two runs at once

permissions:
  contents: write   # lets the bot save its memory back to the repo

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one trading cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
          PAPER: "true"
          # Gold focus: gold ETFs (GLD, IAU), miners ETFs (GDX, GDXJ), big gold miners (NEM, AEM)
          WATCHLIST: "GLD,IAU,GDX,GDXJ,NEM,AEM"
          TRADING_STYLE: active
          FOCUS: "Trade gold. GLD and IAU track the gold price; GDX/GDXJ/NEM/AEM are miners and move about 2x gold. Use gold news, the dollar and rate expectations to decide. Older non-gold positions (e.g. AAPL) may be sold when it makes sense."
          MIN_CONFIDENCE: "0.55"
          MAX_TRADES_PER_DAY: "10"
          MAX_POSITION_PCT: "0.15"
        run: python agent.py --once
      - name: Save the trader's memory (diary + lessons)
        if: always()
        run: |
          git config user.name "ai-trader-bot"
          git config user.email "ai-trader-bot@users.noreply.github.com"
          git add memory/ 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "memory: ${{ github.workflow }}"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i*5)); done
          exit 1
