name: AI crypto trader

on:
  schedule:
    # Every 2 hours, every day (crypto trades 24/7).
    - cron: "5 */2 * * *"
  workflow_dispatch: {}   # "Run workflow" button for a test right now

concurrency: trader-crypto

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one crypto trading cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
          PAPER: "true"
          CRYPTO: "true"
        run: python agent.py --once
