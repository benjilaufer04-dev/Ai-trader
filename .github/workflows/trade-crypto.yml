name: AI 24-7 trader (gold token + crypto)

on:
  schedule:
    # Every 2 hours, every day (crypto trades 24/7).
    - cron: "5 */2 * * *"
  workflow_dispatch: {}   # "Run workflow" button for a test right now

concurrency: trader-crypto

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one crypto trading cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
          PAPER: "true"
          CRYPTO: "true"
          # PAXG = token backed 1:1 by physical gold -> lets it trade gold 24/7
          CRYPTO_WATCHLIST: "PAXG/USD,BTC/USD,ETH/USD,SOL/USD"
          TRADING_STYLE: active
          FOCUS: "Main focus is gold via PAXG/USD (each token = 1 troy ounce of gold, tracks the gold price, trades 24/7). BTC/ETH/SOL are secondary."
          MIN_CONFIDENCE: "0.55"
          MAX_TRADES_PER_DAY: "10"
          MAX_POSITION_PCT: "0.15"
        run: python agent.py --once
