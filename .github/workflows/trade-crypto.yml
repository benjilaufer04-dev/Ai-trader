name: AI 24-7 trader (OFF)

on:
  # Turned off (owner wants only GLD, SPY, QQQ). To turn back on, restore:
  # schedule:
  #   - cron: "5 */2 * * *"
  workflow_dispatch: {}   # "Run workflow" button for a test right now

concurrency: trader-crypto

permissions:
  contents: write   # lets the bot save its memory back to the repo

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one crypto trading cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
          PAPER: "true"
          CRYPTO: "true"
          # PAXG = token backed 1:1 by physical gold -> lets it trade gold 24/7
          CRYPTO_WATCHLIST: "PAXG/USD,BTC/USD,ETH/USD,SOL/USD"
          TRADING_STYLE: active
          FOCUS: "Main focus is gold via PAXG/USD (each token = 1 troy ounce of gold, tracks the gold price, trades 24/7). BTC/ETH/SOL are secondary."
          MIN_CONFIDENCE: "0.55"
          MAX_TRADES_PER_DAY: "10"
          MAX_POSITION_PCT: "0.15"
        run: python agent.py --once
      - name: Save the trader's memory (diary + lessons)
        if: always()
        run: |
          git config user.name "ai-trader-bot"
          git config user.email "ai-trader-bot@users.noreply.github.com"
          git add memory/ 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "memory: ${{ github.workflow }}"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i*5)); done
          exit 1
