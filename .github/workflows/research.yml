name: Strategy lab (research, report only)

# Tests many known trading styles on years of daily bars with a TRAIN/TEST split and a
# placebo luck check. Writes memory/research/. Never trades, never changes the live bot.
on:
  schedule:
    - cron: "45 22 * * 5"   # Fridays after the close
  workflow_dispatch:
    inputs:
      split:
        description: "First TEST day (TRAIN is everything before)"
        default: "2024-01-01"
      placebos:
        description: "Placebo markets for the luck check"
        default: "20"

concurrency: research

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download daily bars (read-only)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python dump_data.py --minute-days 0 --since 2016-01-01
      - name: Strategy lab
        run: python research.py --data data/daily.csv.gz --split ${{ inputs.split || '2024-01-01' }} --placebos ${{ inputs.placebos || '20' }}
      - name: Save results
        run: |
          git config user.name "ai-trader-bot"
          git config user.email "ai-trader-bot@users.noreply.github.com"
          git add memory/research
          git diff --cached --quiet && exit 0
          git commit -m "memory: strategy lab"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
