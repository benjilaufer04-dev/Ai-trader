name: Scalper self-tuning (backtest)

# Every trading night after the close: replay the last 60 days with the scalper rules,
# search for better settings on the first 2/3 of the days, check them on the last 1/3
# (days they never saw), and adopt them only if they make money there AND beat the current ones.
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "Trading days to test"
        default: "60"
      setups:
        description: "Test the expert setups (ORB, VWAP pullback) instead"
        type: boolean
        default: false
      inverse:
        description: "Also test the 'do the opposite' idea"
        type: boolean
        default: false
      adopt:
        description: "Adopt better settings if they pass"
        type: boolean
        default: true

concurrency: backtest

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest and tune
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SCALP_SYMBOLS: "TQQQ,SQQQ,SOXL,SOXS,TSLA,NVDA"
        run: |
          ADOPT="--adopt"
          if [ "${{ inputs.adopt }}" = "false" ]; then ADOPT=""; fi
          if [ "${{ inputs.setups }}" = "true" ]; then
            python setups.py --days ${{ inputs.days || '60' }}
          elif [ "${{ inputs.inverse }}" = "true" ]; then
            python backtest.py --days ${{ inputs.days || '30' }} --inverse
          else
            python backtest.py --days ${{ inputs.days || '60' }} --tune $ADOPT
            # also re-test the alternative trading styles every night (report only)
            python setups.py --days ${{ inputs.days || '60' }} || true
          fi
      - name: Save results
        if: always()
        run: |
          git config user.name "ai-trader-bot"
          git config user.email "ai-trader-bot@users.noreply.github.com"
          git add memory/ 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "memory: scalper self-tuning"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i*5)); done
          exit 1
